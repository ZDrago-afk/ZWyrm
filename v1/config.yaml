zwyrm:
  version: '2.0'
  name: ZWYRM AntiVirus
  author: ZWYRM Security Team
  license: MIT
  debug_mode: false
scanning:
  max_file_size: 100
  scan_depth: 10
  max_threads: 4
  scan_chunk_size: 8192
  exclude_paths:
  - /proc
  - /sys
  - /dev
  - /run
  - /snap
  exclude_extensions:
  - .iso
  - .img
  - .vmdk
  - .vdi
  - .qcow2
  quick_scan_paths:
  - /tmp
  - /var/tmp
  - ~/Downloads
  - ~/Desktop
  system_scan_paths:
  - /bin
  - /sbin
  - /usr/bin
  - /usr/sbin
  - /etc
  skip_symlinks: true
  preserve_file_access_time: true
detection:
  enable_signature_based: true
  enable_heuristics: true
  enable_string_scan: true
  enable_entropy_check: true
  enable_pe_analysis: true
  entropy_threshold: 6.5
  max_string_scan_size: 10
  suspicious_extensions:
  - .exe
  - .dll
  - .so
  - .bat
  - .cmd
  - .vbs
  - .js
  - .ps1
  - .sh
  - .py
  - .pl
  - .rb
  - .php
quarantine:
  auto_quarantine: true
  ask_before_quarantine: false
  max_quarantine_size: 1024
  max_quarantine_files: 1000
  auto_cleanup_days: 30
  backup_before_quarantine: true
updates:
  auto_update: true
  check_on_startup: true
  update_check_interval: 24
  verify_signatures: false
  proxy_enabled: false
  proxy_url: ''
  download_timeout: 30
realtime:
  enabled: false
  monitor_paths:
  - ~/Downloads
  - ~/Desktop
  - /tmp
  exclude_paths:
  - ~/.cache
  - ~/tmp
  scan_delay: 2
  max_concurrent_scans: 2
  action_on_detection: quarantine
  alert_user: true
scheduler:
  enabled: false
  daily_scan:
    enabled: true
    time: 02:00
    type: quick
  weekly_scan:
    enabled: true
    day: sunday
    time: 03:00
    type: full
logging:
  level: INFO
  file: logs/zwyrm.log
  max_size: 10
  backup_count: 5
  enable_json_log: true
  keep_logs_days: 30
notifications:
  enable_desktop_notifications: true
  enable_email_alerts: false
  alert_on_threat: true
  alert_on_update: true
performance:
  max_cpu_usage: 80
  max_memory_usage: 512
  enable_hash_cache: true
  cache_ttl: 3600
  use_multithreading: true
  thread_pool_size: 4
ui:
  colors_enabled: true
  progress_bar: true
  show_scan_details: true
  verbose_mode: false
